services:
  rat-dev-full:
    image: mide233/flyrat-dev-full:latest
    privileged: true
    network_mode: host
    gpus: all
    init: true
    command: /bin/sh -c "while sleep 1000; do :; done"
    working_dir: /home/ubuntu
    volumes:
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: bind
        source: ..
        target: /workspaces/flyrat
