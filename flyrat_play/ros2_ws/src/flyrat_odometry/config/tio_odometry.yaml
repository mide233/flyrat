tio_odometry_node:
  ros__parameters:
    # Installed model path is replaced by the launch file; this default works
    # when running from the package source tree with a relative path.
    model_path: ""
    world_frame: odometry_map
    body_frame: imu_link
    warmup_frames: 64
    path_max_poses: 1000
    path_publish_period: 0.2
    status_period: 1.0
    trajectory_path: ""
    tof_rate_hz: 15.0
    imu_buffer_seconds: 2.0
    # Forward mono camera branch. Must be true only for a camera-enabled
    # TorchScript export (metadata "camera": true).
    camera_enabled: false
    camera_width: 160
    camera_height: 120
    camera_topic: /flyrat/sensors/camera/image_raw
    # View index -> sensor id. The model expects front, left, right, down.
    # The airframe nose is the old rear-ToF end, so after the 180-degree
    # redefinition the physical ids from INT/LPn wiring are:
    #   0 = down  (INT 3B3 / LPn 3B4)
    #   1 = front (INT 3B0 / LPn 3C2)
    #   2 = right (INT 3A4 / LPn 3A5)
    #   3 = left  (INT 3A1 / LPn 3A2)
    # Model front/left/right/down therefore maps to sensors 1/3/2/0.
    sensor_order: [1, 3, 2, 0]
