# Kalibr IMU scale-misalignment model from
# kalibr_ws/20261113_152636/imu-calib_raw.yaml.
#
# The model is applied after the MSP counts -> SI conversion and axis mapping
# in sensor_receiver_node:
#
#   a_body = inv(imu_acc_M) * a_raw
#   w_body = imu_gyr_C_gyro_i^T * inv(imu_gyr_M) *
#            (w_raw - imu_gyr_A * (imu_gyr_C_gyro_i * a_body))
#
# Biases are not included: Kalibr estimated them as time-varying splines and
# the odometry backend estimates its own bias states. Matrices are row-major.
#
# imu_time_offset shifts the IMU header stamp back by the Kalibr cam0 time
# shift (t_imu = t_cam + shift), so the IMU sample is aligned with the camera
# exposure time.
sensor_receiver:
  ros__parameters:
    imu_intrinsics_enable: true
    imu_time_offset: 0.005105770284791938
    imu_acc_M:
      [1.0043883625447672, 0.0, 0.0,
       -0.00392155762041143, 1.0041976371125416, 0.0,
       0.0007904087750521604, 0.0045912246725158335, 1.0049011163137578]
    imu_gyr_M:
      [0.9981421203811249, 0.0, 0.0,
       0.003294564723900515, 1.003874679630006, 0.0,
       -0.010801036081871501, 0.00978789229584205, 0.9987339681228927]
    imu_gyr_A:
      [-3.069326958185335e-05, -2.766797502475808e-05, 2.234262673513326e-05,
       4.919191783059867e-05, -6.06456782550126e-07, 9.323959266650082e-05,
       0.00010337905915128237, -9.633647262580768e-05, -8.905011444038703e-06]
    imu_gyr_C_gyro_i:
      [0.9999911381577858, 0.0023467163496505876, -0.003495215053614873,
       -0.002334751270564891, 0.99999141449739, 0.003423429276932589,
       0.003503218862892957, -0.0034152384812551795, 0.999988031730238]
