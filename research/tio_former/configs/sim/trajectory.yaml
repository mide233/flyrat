# Trajectory definitions for the TIO-Former simulation.
#
# The paper reports 2,195 m over 9,492 s (about 0.23 m/s average).  Rather than
# using that as a hard speed, the generator produces slow local waypoint walks
# (0.6-2.0 m steps) at 1.6 m altitude; the batch generator measures the actual
# path length and reports the resulting average speed.

trajectory:
  sample_rate_hz: 100.0
  speed_mps: 0.3
  altitude_m: 1.6
  min_clearance_m: 0.3
  canonical_ratio: 0.2
  train_length_s: [20.0, 60.0]
  test_length_s: [8.0, 20.0]
  test_path_length_m: [4.0, 7.0]

canonical:
  shapes: [circle, figure_eight, square, straight]
  radius_m: [1.0, 2.0]
  speed_mps: [0.2, 0.4]

random:
  waypoint_count: [4, 10]
  waypoint_step_m: [0.4, 1.4]
  speed_mps: [0.15, 0.35]
  accel_mps2: [1.0, 3.0]
  vertical_jitter_m: 0.15
  yaw_mode: velocity

# Stop-and-go inspection profile (enabled by default in v4 datasets).
inspection:
  enabled: true
  motion_mix:
    static: 0.30
    micro: 0.05
    low: 0.40
    normal: 0.25
  lateral_excursion_m: 1.8
  vertical_excursion_m: 0.5
  max_speed_mps: 1.0
  return_to_start: true
