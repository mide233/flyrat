seed: 0
device: cuda
distributed: true

data:
  window_frames: 64
  batch_size: 32
  num_workers: 8
  pin_memory: true
  imu_samples_per_tof: 16

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

training:
  epochs: 100
  grad_accumulation: 2
  grad_clip: 1.0
  amp: true
  amp_dtype: bfloat16
  early_stopping_patience: 15
  log_every: 50
  validate_every_epochs: 1
  save_top_k: 3

loss:
  step:
    beta_translation: 0.05
    beta_rotation: 0.02
  multi_horizon:
    position_horizons: [4, 8, 16, 32]
    rotation_horizons: [4, 8, 16]
    position_weight: 0.02
    rotation_weight: 0.005
  scale:
    beta: 0.10
    weight: 0.005
  residual:
    beta: 0.02
    weight: 0.005

augmentation:
  missing_ratio: [0.1, 0.3, 0.5]
  missing_probability: 0.6
  ar1_gamma: 0.9
  ar1_sigma_m: 0.01
  view_dropout_probability: 0.2
