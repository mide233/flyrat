[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tio-former-reproduction"
version = "0.1.0"
description = "Clean-room simulation reproduction of TIO-Former"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "h5py>=3.10",
  "scipy>=1.11",
  "matplotlib>=3.8",
]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tio_former*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
