%YAML:1.0

# ORB-SLAM3 stereo-inertial configuration for the DECXIN side-by-side UVC
# camera and the Betaflight MSP IMU.
#
# Camera intrinsics, stereo extrinsics and the camera-to-body transform come
# from the Aprilgrid / Kalibr calibration in kalibr_ws/ (calib-camchain.yaml and
# calib-results-imucam.txt). IMU noise densities and random walks come from the
# 3 h Allan-variance run (kalibr_ws/calib-imu.yaml). The IMU scale/misalignment
# model itself is applied by sensor_receiver_node from
# flyrat_sensors/config/imu_intrinsics.yaml, so these noise values describe the
# corrected IMU stream that ORB-SLAM3 actually receives.
#
# Camera.width / Camera.height are PER EYE, after the 1280x480 side-by-side
# frame has been split into two 640x480 images.

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 263.8944789508884
Camera1.fy: 264.2221686315651
Camera1.cx: 328.33103204366546
Camera1.cy: 245.11012027757533
Camera1.k1: 0.005805984322220785
Camera1.k2: -0.019703130296586234
Camera1.p1: -0.00041916041353596656
Camera1.p2: 0.000898507775705815

Camera2.fx: 265.05944864498065
Camera2.fy: 265.26751510610734
Camera2.cx: 319.63795173669627
Camera2.cy: 243.59153179478997
Camera2.k1: 0.0023129278708706766
Camera2.k2: -0.01664389708566031
Camera2.p1: 0.0012621354146951274
Camera2.p2: 0.0008616837219406815

Camera.width: 640
Camera.height: 480
Camera.fps: 60
Camera.RGB: 0

Stereo.ThDepth: 40.0

# T_c1_c2: left <- right (a point in the right optical frame mapped into the
# left optical frame), metres. This is the inverse of Kalibr's
# cam1.T_cn_cnm1. Baseline is 0.06475 m.
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.99994909969542711, -4.4931522482140771e-05, 0.01008940035274482, 0.064748652700041348,
         4.5586892323950407e-05, 0.9999999968661778, -6.4726304149042272e-05, 1.7468966573938489e-05,
         -0.010089397412874965, 6.5182953967940518e-05, 0.99994909861004544, -0.00031089045377673155,
         0.0, 0.0, 0.0, 1.0]

# T_b_c1: camera -> body (IMU). A point in the left optical frame is mapped
# into the body frame. The columns are the camera axes expressed in body; the
# translation is the camera origin in body. ORB-SLAM3 uses the inverse
# (body -> camera) internally, so do not write a body -> camera matrix here.
# This is the inverse of Kalibr's T_cam_imu (cam0 <- IMU). ORB-SLAM3 expects
# the body frame to match the IMU convention: X forward, Y left, Z up, which is
# what sensor_receiver_node publishes.
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.0071125474293740037, -0.020471129486475191, 0.99976514468479594, 0.040311961511474315,
         0.99992913363485136, -0.0093993364191891481, -0.0073061743157868137, -0.044603189010430866,
         0.0095466945755410017, 0.99974626047433901, 0.020402825545851884, 0.0089198661531387363,
         0.0, 0.0, 0.0, 1.0]

# Continuous-time noise densities and random walks from the 3 h Allan-variance
# run (kalibr_ws/calib-imu.yaml), after the IMU scale/misalignment correction.
IMU.NoiseGyro: 8.814974125038311e-05
IMU.NoiseAcc: 0.0029907713760960264
IMU.GyroWalk: 4.09314724371554e-06
IMU.AccWalk: 0.00015441665140112607
IMU.Frequency: 200.0

# Bench/testing: stereo already provides metric scale, so allow the map to
# initialise without a sharp linear-acceleration transient. Set to 0 for
# flight, where the acceleration check rejects a bad inertial initialisation.
IMU.fastInit: 1

ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
