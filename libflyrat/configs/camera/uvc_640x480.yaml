%YAML:1.0
#
# Camera + IMU calibration for the DECXIN side-by-side UVC module and the
# Betaflight IMU. This file is algorithm-neutral: the odometry backend reads the
# intrinsics, stereo extrinsic and IMU noise model from here.
#
# The values come from a Kalibr stereo-inertial calibration of the development
# vehicle. Recalibrate if the camera, lens or IMU mounting changes.
#
# Conventions:
#   camera.T_left_right : p_left = T_left_right * p_right
#   imu.T_body_camera   : p_body = T_body_camera * p_camera
#
# camera.width / camera.height are per eye, after the side-by-side frame has
# been split in two.

camera:
  width: 640
  height: 480
  fps: 60

  left:
    fx: 262.58424702839864
    fy: 263.22632961283045
    cx: 327.8657183307053
    cy: 247.22258605808088
    k1: 0.0022390866445024366
    k2: -0.01737775935627343
    p1: -0.00017642832530633304
    p2: -0.0001846589975247357

  right:
    fx: 263.60940553155547
    fy: 264.17813753868273
    cx: 319.2012702264154
    cy: 244.0867043533818
    k1: -0.000833547109760926
    k2: -0.015326129475827599
    p1: 0.0014107900602434744
    p2: 9.549787993732614e-05

  T_left_right: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.999952689916004, 4.83505034846312e-05, 0.009727054640603581, 0.06466722350146012,
           -5.728347720749216e-05, 0.999999576917186, 0.0009180871726300503, 1.3218996064444315e-05,
           -0.009727006135276871, -0.0009186009373615964, 0.9999522696228887, -0.0002998654991042714,
           0.0, 0.0, 0.0, 1.0]

imu:
  frequency: 200.0
  noise_gyro: 8.814974125038311e-05
  noise_acc: 0.0029907713760960264
  gyro_walk: 4.09314724371554e-06
  acc_walk: 0.00015441665140112607

  T_body_camera: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.01898389545120597, -0.0028724480440791393, 0.9998156633878722, 0.042386487659436915,
           0.9997530920477588, -0.011495945552930266, -0.019015734978936022, -0.04565232848455837,
           0.011548448140020744, 0.9999297936745747, 0.0026535009853250343, 0.009187774336077164,
           0.0, 0.0, 0.0, 1.0]
