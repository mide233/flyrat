%YAML:1.0
#
# Camera + IMU calibration for the DECXIN side-by-side UVC module and the
# Betaflight IMU. This file is algorithm-neutral: the future odometry backend
# reads the intrinsics, stereo extrinsic and IMU noise model from here.
#
# The values come from a Kalibr stereo-inertial calibration of the development
# vehicle. Recalibrate if the camera, lens or IMU mounting changes.
#
# Conventions:
#   camera.T_left_right : p_left = T_left_right * p_right
#   imu.T_body_camera   : p_body = T_body_camera * p_camera
#
# camera.width / camera.height are per eye, after the side-by-side frame has
# been split in two.

camera:
  width: 640
  height: 480
  fps: 60

  left:
    fx: 263.8944789508884
    fy: 264.2221686315651
    cx: 328.33103204366546
    cy: 245.11012027757533
    k1: 0.005805984322220785
    k2: -0.019703130296586234
    p1: -0.00041916041353596656
    p2: 0.000898507775705815

  right:
    fx: 265.05944864498065
    fy: 265.26751510610734
    cx: 319.63795173669627
    cy: 243.59153179478997
    k1: 0.0023129278708706766
    k2: -0.01664389708566031
    p1: 0.0012621354146951274
    p2: 0.0008616837219406815

  T_left_right: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.99994909969542711, -4.4931522482140771e-05, 0.01008940035274482, 0.064748652700041348,
           4.5586892323950407e-05, 0.9999999968661778, -6.4726304149042272e-05, 1.7468966573938489e-05,
           -0.010089397412874965, 6.5182953967940518e-05, 0.99994909861004544, -0.00031089045377673155,
           0.0, 0.0, 0.0, 1.0]

imu:
  frequency: 200.0
  noise_gyro: 8.814974125038311e-05
  noise_acc: 0.0029907713760960264
  gyro_walk: 4.09314724371554e-06
  acc_walk: 0.00015441665140112607

  T_body_camera: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data: [0.0071125474293740037, -0.020471129486475191, 0.99976514468479594, 0.040311961511474315,
           0.99992913363485136, -0.0093993364191891481, -0.0073061743157868137, -0.044603189010430866,
           0.0095466945755410017, 0.99974626047433901, 0.020402825545851884, 0.0089198661531387363,
           0.0, 0.0, 0.0, 1.0]
